<script>
  // const btn = document.getElementById("menu-toggle");
  // const links = document.querySelector(".tab-links");
  // btn.addEventListener("click", () => links.classList.toggle("active"));
  const tabLinks = document.querySelector(".tab-links");

  document.getElementById("menu-toggle")
  .addEventListener("click", function () {
    tabLinks.classList.toggle("active");
  });

  document.querySelectorAll(".tab-links a").forEach(link => {

      tabLinks.classList.remove("active");
    });

  const allowed = new Set(['about','publications','projects','experience','post','twelve']);
  const sectionEl = document.getElementById('section');

  function load(id){
    if(!allowed.has(id)) id = 'about';

    fetch(`sections/${id}.html`)
      .then(r => r.text())
      .then(html => {
        sectionEl.innerHTML = html;

        // highlight active tab
        document.querySelectorAll('.tabs a').forEach(a=>{
          a.classList.toggle('active', a.getAttribute('href') === `#${id}`);
        });
        if (id === 'twelve') setTimeout(initTwelveFromJson, 0);
      });
  }

  function current(){
    return location.hash.replace('#','') || 'about';
  }

  window.addEventListener('hashchange', () => load(current()));
  load(current());

  // ✅ post click handling (dynamic content)
  sectionEl.addEventListener('click', (e) => {
    const openBtn = e.target.closest('.post-open');
    const backBtn = e.target.closest('.post-back');

    // Open entry (load from /posts)
    if (openBtn) {
      const file = openBtn.dataset.file; // <-- MUST be data-file in sections/post.html
      const listView = sectionEl.querySelector('#post-list');
      const entryView = sectionEl.querySelector('#post-entry');
      const article = sectionEl.querySelector('#post-article');

      if (!listView || !entryView || !article || !file) return;

      listView.classList.remove('active');
      entryView.classList.add('active');

      fetch(`posts/${file}.html`)
        .then(r => r.text())
        .then(html => {
          article.innerHTML = html;
        })
        .catch(() => {
          article.innerHTML =
            `<h3 class="post-entry-title">Not found</h3>
             <p>Could not load posts/${file}.html</p>`;
        });

      return; // stop here
    }

    // Back to list
    if (backBtn) {
      const listView = sectionEl.querySelector('#post-list');
      const entryView = sectionEl.querySelector('#post-entry');
      if (!listView || !entryView) return;

      entryView.classList.remove('active');
      listView.classList.add('active');
    }
  });

  // ✅ Theme toggle
  const toggleBtn = document.getElementById('theme-toggle');

  function setTheme(mode){
    document.body.classList.toggle('light', mode === 'light');
    localStorage.setItem('theme', mode);
    toggleBtn.textContent = mode === 'light' ? '◐' : '◑';
  }

  toggleBtn.addEventListener('click', () => {
    const isLight = document.body.classList.contains('light');

  setTheme(localStorage.getItem('theme') || 'light');

/* ============================
   12-WEEKS MODULE (index.html)
   - Data source: /twelve.json
   - Requires containers in sections/twelve.html:
       #tw-grid
       #tw-week-labels        (optional)
       #tw-weekly-bars
       #tw-avg-donut
       #tw-avg-text
       #tw-day-info
       #tw-act-list
       .tw-goal-btn buttons with data-goal="all|g1|g2|g3"  (optional)
   - Your router must call initTwelveFromJson() after loading #twelve section.
   ============================ */

/* ======== Hook into your router ========
Inside your load(id) .then(html => { ... }) add:
  if (id === 'twelve') setTimeout(initTwelveFromJson, 0);
And make sure your tab/hash is:
  <a href="#twelve">12 Weeks</a>
And your allowed set includes 'twelve'.
======================================== */
const GOAL_WEIGHTS = [6, 2, 2];
const WEIGHT_SUM = GOAL_WEIGHTS.reduce((a,b)=>a+b,0);

let TWELVE = {
  initialized: false,
  data: null,
  state: null,
  days: [],
  selectedGoal: 'all',
  selectedDate: null,
  startISO: null,
  weeks: 12,
  goals: ['Goal 1', 'Goal 2', 'Goal 3'],
};

async function initTwelveFromJson() {
  // Only run when twelve section exists on page
  const grid = document.getElementById('tw-grid');
  if (!grid) return;

  // Load JSON
  let data;
  try {
    const r = await fetch('twelve.json', { cache: 'no-store' });
    if (!r.ok) throw new Error(`HTTP ${r.status} loading twelve.json`);
    data = await r.json();
  } catch (err) {
    console.error(err);
    grid.innerHTML = `<p style="opacity:.8;">Failed to load twelve.json: ${err.message}</p>`;
    return;
  }

  // Store and render
  TWELVE.data = data;
  TWELVE.startISO = data.start || TWELVE.startISO || twDefaultStartMondayISO();
  TWELVE.weeks = Number.isFinite(data.weeks) ? data.weeks : 12;
  TWELVE.goals = Array.isArray(data.goals) && data.goals.length === 3 ? data.goals : TWELVE.goals;

  // Build state from JSON logs
  TWELVE.state = twBuildStateFromJson(data);

  // Restore UI selections (optional)
  TWELVE.selectedGoal = TWELVE.state.selectedGoal || 'all';
  TWELVE.selectedDate = TWELVE.state.selectedDate || null;

  // Build date grid
  TWELVE.days = twBuildDays(TWELVE.startISO, TWELVE.weeks);

  // Bind goal selector buttons (if present)
  twBindGoalButtons();

  // Render everything
  twRenderAll();
}

function twBuildStateFromJson(data) {
  const st = { activitiesByDate: {} };

  const logs = Array.isArray(data.logs) ? data.logs : [];
  for (const day of logs) {
    const iso = (day.date || '').trim();
    if (!iso) continue;

    const items = Array.isArray(day.items) ? day.items : [];
    st.activitiesByDate[iso] = items.map((it) => ({
      name: (it.thing ?? it.name ?? 'Untitled').toString(),
      g1: clamp(0, 100, Number(it.g1) || 0), // points
      g2: clamp(0, 100, Number(it.g2) || 0),
      g3: clamp(0, 100, Number(it.g3) || 0),
    }));
  }
  return st;
}

function twNormalizeWeights(g1, g2, g3) {
  const s = g1 + g2 + g3;
  if (s <= 0) return { g1: 0, g2: 0, g3: 0 };
  return { g1: g1 / s, g2: g2 / s, g3: g3 / s };
}

/* ---------- Build day list for 12 weeks ---------- */
// We use GitHub-like layout: columns=weeks, rows=7 days starting Monday.
function twBuildDays(startISO, weeks) {
  const start = parseISODate(startISO);
  const out = [];
  for (let w = 0; w < weeks; w++) {
    for (let r = 0; r < 7; r++) {
      const d = new Date(start);
      d.setDate(start.getDate() + w * 7 + r);
      out.push({ iso: toISO(d), week: w, row: r });
    }
  }
  return out;
}

function twComputeDay(st, iso) {
  const acts = st.activitiesByDate?.[iso] || [];

  let p1 = 0, p2 = 0, p3 = 0;
  for (const a of acts) {
    p1 += clamp(0, 100, Number(a.g1) || 0);
    p2 += clamp(0, 100, Number(a.g2) || 0);
    p3 += clamp(0, 100, Number(a.g3) || 0);
  }

  const g1 = clamp01(p1 / 100);
  const g2 = clamp01(p2 / 100);
  const g3 = clamp01(p3 / 100);

  // 🔥 Weighted 6:2:2
  const total =
    (GOAL_WEIGHTS[0]*g1 +
    GOAL_WEIGHTS[1]*g2 +
    GOAL_WEIGHTS[2]*g3) / WEIGHT_SUM;
  return { g1, g2, g3, total, acts, p1, p2, p3 };
}

function twIntensity(v01) {
  if (v01 <= 0) return 0;
  if (v01 < 0.06) return 1;
  if (v01 < 0.11) return 2;
  if (v01 < 0.16) return 3;
  return 4;
}

/* ---------- UI: goal buttons ---------- */
function twBindGoalButtons() {
  const btns = document.querySelectorAll('.tw-goal-btn');
  if (!btns.length) return;

  btns.forEach((btn) => {
    btn.classList.toggle('active', btn.dataset.goal === TWELVE.selectedGoal);
    btn.onclick = () => {
      TWELVE.selectedGoal = btn.dataset.goal || 'all';
      btns.forEach((b) => b.classList.toggle('active', b.dataset.goal === TWELVE.selectedGoal));
      twRenderAll();
    };
  });

  // If you show goal names somewhere, you can inject them here if you want
  // (Not required.)
}

/* ---------- Render all ---------- */
function twRenderAll() {
  twRenderWeekLabels();
  twRenderGrid();
  twRenderWeeklyBars();
  twRenderAllPastAvgDonut(); // last 4 weeks
  twRenderSelectedDay();
}

/* ---------- Render week labels (optional) ---------- */
function twRenderWeekLabels() {
  const el = document.getElementById('tw-week-labels');
  if (!el) return;

  el.innerHTML = '';
  for (let w = 0; w < TWELVE.weeks; w++) {
    const span = document.createElement('span');
    // label every 2 weeks to reduce clutter
    span.textContent = `W${w + 1}`;
    el.appendChild(span);
  }
}

/* ---------- Render grid ---------- */
function twRenderGrid() {
  const grid = document.getElementById('tw-grid');
  if (!grid) return;

  grid.innerHTML = '';

  // Expect your CSS to set #tw-grid as:
  // display:grid; grid-auto-flow:column; grid-template-rows: repeat(7, ...);
  // If not, it will still render but may look odd.
  for (let w = 0; w < TWELVE.weeks; w++) {
    for (let r = 0; r < 7; r++) {
      const iso = TWELVE.days[w * 7 + r].iso;
      const d = twComputeDay(TWELVE.state, iso);

      let val = 0;
      if (TWELVE.selectedGoal === 'all') val = d.total;
      else if (TWELVE.selectedGoal === 'g1') val = d.g1;
      else if (TWELVE.selectedGoal === 'g2') val = d.g2;
      else if (TWELVE.selectedGoal === 'g3') val = d.g3;

      const lv = twIntensity(val);

      const cell = document.createElement('div');
      cell.className = `tw-cell lv${lv}`;
      cell.dataset.iso = iso;

      // selection outline
      if (TWELVE.selectedDate === iso) cell.classList.add('selected');

      // tooltip
      cell.title =
        `${iso}\n` +
        `${TWELVE.goals[0]}: ${pct(d.g1)}\n` +
        `${TWELVE.goals[1]}: ${pct(d.g2)}\n` +
        `${TWELVE.goals[2]}: ${pct(d.g3)}\n` +
        `Total: ${pct(d.total)}`;

      cell.onclick = () => {
        TWELVE.selectedDate = iso;
        twRenderAll(); // refresh selection + side panel
      };

      grid.appendChild(cell);
    }
  }
}

function twRenderWeeklyBars() {
  const wrap = document.getElementById('tw-weekly-bars');
  if (!wrap) return;

  wrap.innerHTML = '';

  for (let w = 0; w < TWELVE.weeks; w++) {
    // sum weekly points per goal
    let wp1 = 0, wp2 = 0, wp3 = 0;

    for (let r = 0; r < 7; r++) {
      const iso = TWELVE.days[w * 7 + r].iso;
      const d = twComputeDay(TWELVE.state, iso);
      wp1 += d.p1 || 0;
      wp2 += d.p2 || 0;
      wp3 += d.p3 || 0;
    }

    // convert to weekly % (cap at 100)
    const wg1 = clamp01(wp1 / 100);
    const wg2 = clamp01(wp2 / 100);
    const wg3 = clamp01(wp3 / 100);

    // ✅ weekly "All" = average of 3 weekly goals
    const wall =
      (GOAL_WEIGHTS[0]*wg1 +
      GOAL_WEIGHTS[1]*wg2 +
      GOAL_WEIGHTS[2]*wg3) / WEIGHT_SUM;
    // choose displayed value based on filter
    let v = wall;
    if (TWELVE.selectedGoal === 'g1') v = wg1;
    if (TWELVE.selectedGoal === 'g2') v = wg2;
    if (TWELVE.selectedGoal === 'g3') v = wg3;

    const pctInt = Math.round(v * 100);

    const row = document.createElement('div');
    row.className = 'tw-weekbar';
    row.innerHTML = `
      <div class="tw-weekbar-top">
        <span>Week ${w + 1}</span>
        <span>${pctInt}%</span>
      </div>
      <div class="tw-weekbar-track">
        <div class="tw-weekbar-fill" style="width:${pctInt}%"></div>
      </div>
    `;
    wrap.appendChild(row);
  }
}

function twRenderAllPastAvgDonut() {
  const donut = document.getElementById('tw-avg-donut');
  const text = document.getElementById('tw-avg-text');
  if (!donut || !text) return;

  let sum = 0;
  let cnt = 0;

  for (let w = 0; w < TWELVE.weeks; w++) {
    let wp1 = 0, wp2 = 0, wp3 = 0;
    let hasAny = false;

    for (let r = 0; r < 7; r++) {
      const iso = TWELVE.days[w * 7 + r].iso;
      const d = twComputeDay(TWELVE.state, iso);
      if ((d.p1 || 0) + (d.p2 || 0) + (d.p3 || 0) > 0) hasAny = true;
      wp1 += d.p1 || 0;
      wp2 += d.p2 || 0;
      wp3 += d.p3 || 0;
    }

    if (!hasAny) continue;

    const wg1 = clamp01(wp1 / 100);
    const wg2 = clamp01(wp2 / 100);
    const wg3 = clamp01(wp3 / 100);
    const wall =
          (GOAL_WEIGHTS[0]*wg1 +
          GOAL_WEIGHTS[1]*wg2 +
          GOAL_WEIGHTS[2]*wg3) / WEIGHT_SUM;
    let v = wall;
    if (TWELVE.selectedGoal === 'g1') v = wg1;
    if (TWELVE.selectedGoal === 'g2') v = wg2;
    if (TWELVE.selectedGoal === 'g3') v = wg3;

    sum += v;
    cnt += 1;
  }

  const avg = cnt ? sum / cnt : 0;
  const pctInt = Math.round(avg * 100);

  const rest = document.body.classList.contains('light')
    ? 'rgba(0,0,0,0.10)'
    : 'rgba(255,255,255,0.10)';

  donut.style.background = `conic-gradient(var(--accent) ${pctInt * 3.6}deg, ${rest} 0deg)`;
  text.textContent = `${pctInt}%`;
}

function twRenderSelectedDay() {
  const infoEl = document.getElementById('tw-day-info');
  const listEl = document.getElementById('tw-act-list');
  if (!infoEl || !listEl) return;

  const iso = TWELVE.selectedDate;
  if (!iso) {
    infoEl.textContent = 'Click a cell';
    listEl.innerHTML = '';
    return;
  }

  const d = twComputeDay(TWELVE.state, iso);

  // Header info
  const pAll = Math.round(d.total * 100);
  const p1 = Math.round(d.g1 * 100);
  const p2 = Math.round(d.g2 * 100);
  const p3 = Math.round(d.g3 * 100);

  infoEl.innerHTML = `
    <div><strong>${iso}</strong></div>
    <div style="opacity:.8; margin-top:.3rem;">
      All: <strong>${pAll}%</strong>
      &nbsp; · &nbsp; G1: <strong>${p1}%</strong>
      &nbsp; · &nbsp; G2: <strong>${p2}%</strong>
      &nbsp; · &nbsp; G3: <strong>${p3}%</strong>
    </div>
  `;

  // List items
  const acts = d.acts || [];
  if (!acts.length) {
    listEl.innerHTML = `<div style="opacity:.75;">No items logged.</div>`;
    return;
  }

  listEl.innerHTML = '';
  for (const a of acts) {
    const c1 = Math.round(Number(a.g1) || 0);
    const c2 = Math.round(Number(a.g2) || 0);
    const c3 = Math.round(Number(a.g3) || 0);
    const sum = c1 + c2 + c3;

    const div = document.createElement('div');
    div.className = 'tw-act-item';
    div.innerHTML = `
      <div class="tw-act-top">
        <div class="tw-act-name">${escapeHtml(a.name || 'Untitled')}</div>
        <div class="tw-act-meta">+${sum}%</div>
      </div>
      <div class="tw-act-detail">
        G1 +${c1}% · G2 +${c2}% · G3 +${c3}%
      </div>
    `;
    listEl.appendChild(div);
  }
}

/* ---------- Utilities ---------- */
function pct(v01) { return `${Math.round(v01 * 100)}%`; }
function clamp(min, max, x) { return Math.max(min, Math.min(max, x)); }
function clamp01(x) { return clamp(0, 1, x); }

function parseISODate(iso) {
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d);
}
function toISO(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

// Default plan start: this week's Monday
function twDefaultStartMondayISO() {
  const now = new Date();
  const day = now.getDay(); // 0 Sun .. 6 Sat
  const delta = (day === 0) ? -6 : (1 - day); // shift to Monday
  const mon = new Date(now);
  mon.setDate(now.getDate() + delta);
  return toISO(mon);
}

function escapeHtml(s) {
  return String(s)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}
