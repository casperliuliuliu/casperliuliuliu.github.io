<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Friendly Casper - Portfolio</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="casper.png" type="image/png">
</head>
<body>
  <!-- TOP TABS -->
  <nav class="tabs">
    <a href="#about">About</a>
    <a href="#publications">Publications</a>
    <a href="#projects">Projects</a>
    <a href="#experience">Experience</a>
    <a href="#award">Award</a>
  </nav>

  <div class="layout">
    <!-- LEFT COLUMN -->
    <aside class="sidebar">
      <img src="./assets/avatar.jpeg" alt="Your Pixel Avatar" class="avatar">
      <p class="avatar-name">Liu Shih-Wen, CASPER</p>
      <h2>Skills & Interests</h2>
      <ul class="pixel-list">
        <li><span class="char-icon skill-ai"></span>LoRA & Efficient Tuning</li>
        <li><span class="char-icon skill-contrast"></span>Multi Agent Learning</li>
        <li><span class="char-icon skill-ros"></span>Weight Lifting</li>
        <li><span class="char-icon skill-pixel"></span>Book Reading</li>
        <li><span class="char-icon skill-pixel"></span>Bouldering</li>
        
      </ul>

    </aside>

   
    <main class="content">
      <div id="section"></div>
             <section id="contact">
          <h2>Contact</h2>
          <p>Email: <a href="mailto:casperliu1118@gmail.com">casperliu1118@gmail.com</a><br>
              GitHub: <a href="https://github.com/casperliuliuliu">casperliuliuliu</a></p>
      </section>
    </main>
  </div>
  <script>
    const allowed = new Set(['about','publications','projects','experience','award','contact']);

    function load(id){
      if(!allowed.has(id)) id = 'about';
      fetch(`sections/${id}.html`)
        .then(r => r.text())
        .then(html => document.getElementById('section').innerHTML = html);

      // optional: highlight active tab
      document.querySelectorAll('.tabs a').forEach(a=>{
        a.classList.toggle('active', a.getAttribute('href') === `#${id}`);
      });
    }

    function current(){
      return location.hash.replace('#','') || 'about';
    }

    window.addEventListener('hashchange', () => load(current()));
    load(current());
  </script>
  
</body>
</html>
