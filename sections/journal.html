<section id="journal">

  <!-- LIST VIEW -->
  <div class="journal-view active" id="journal-list">
    <div class="journal-header">
      <h2>Journal</h2>
      <p class="journal-subtitle">Notes, reflections, and progress logs.</p>
    </div>

    <ul class="journal-index">
      <li class="journal-item">
        <button class="journal-open" data-file="2026-02-24-building-journal">
          <span class="journal-title">Building Journal</span>
          <span class="journal-meta">2026-02-24</span>
        </button>
      </li>

      <li class="journal-item">
        <button class="journal-open" data-file="2026-02-21-cvpr-reflection">
          <span class="journal-title">CVPR Reflection</span>
          <span class="journal-meta">2026-02-21</span>
        </button>
      </li>

      <li class="journal-item">
        <button class="journal-open" data-file="uncontacted-tribe">
          <span class="journal-title">Uncontacted Tribe</span>
          <span class="journal-meta">—</span>
        </button>
      </li>
    </ul>
  </div>

  <!-- ENTRY VIEW -->
  <div class="journal-view" id="journal-entry">
    <button class="journal-back" type="button">← Back</button>

    <!-- fetched journal html will be injected here -->
    <article class="journal-article" id="journal-article">
      <h3 class="journal-entry-title">Loading...</h3>
    </article>
  </div>

  <style>
    .journal-view { display: none; }
    .journal-view.active { display: block; }

    .journal-header { margin-bottom: 1rem; }
    .journal-subtitle { opacity: 0.75; margin-top: 0.5rem; line-height: 1.4; }

    .journal-index {
      list-style: none;
      padding: 0;
      margin-top: 1.5rem;
    }

    .journal-item {
      margin-bottom: 1rem;
    }

    
    .journal-open {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.3rem;

      background: var(--content-bg);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: 12px;

      padding: 1rem 1.2rem;

      color: var(--text);
      cursor: pointer;
      text-align: left;

      transition: 
        transform 0.15s ease,
        box-shadow 0.15s ease,
        border-color 0.15s ease;
    }
    .journal-open:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
      /* border-color: var(--accent); */
    }

    body.light .journal-open:hover {
      box-shadow: 0 6px 18px rgba(0,0,0,0.05);
    }

    .journal-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
    }

    .journal-meta {
      font-size: 0.85rem;
      opacity: 0.6;
      letter-spacing: 0.5px;
    }

    .journal-back {
      background: none;
      border: none;
      color: var(--accent);
      cursor: pointer;
      padding: 0;
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }

    .journal-article {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(255,255,255,0.02);
      padding: 1.2rem 1.2rem;
    }

    body.light .journal-article {
      background: rgba(0,0,0,0.02);
    }

    .journal-entry-title {
      margin-bottom: 0.4rem;
      line-height: 1.25;
    }

    .journal-published {
      margin: 0.4rem 0 1.2rem;
      opacity: 0.7;
      font-size: 0.95rem;
    }

    .journal-article p {
      line-height: 1.7;
      margin: 0.9rem 0;
      white-space: pre-wrap; /* keeps your paragraph formatting */
    }
  </style>
</section>
