<section id="post">

  <!-- LIST VIEW -->
  <div class="post-view active" id="post-list">
    <div class="post-header">
      <h2>Post</h2>
      <p class="post-subtitle">Notes, reflections, and progress logs.</p>
    </div>

    <ul class="post-index">
      <li class="post-item">
        <button class="post-open" data-file="2026-02-24-building-post">
          <span class="post-title">Building post</span>
          <span class="post-meta">2026-02-24</span>
        </button>
      </li>

      <li class="post-item">
        <button class="post-open" data-file="2026-02-21-cvpr-reflection">
          <span class="post-title">CVPR Reflection</span>
          <span class="post-meta">2026-02-21</span>
        </button>
      </li>

      <li class="post-item">
        <button class="post-open" data-file="uncontacted-tribe">
          <span class="post-title">Uncontacted Tribe</span>
          <span class="post-meta">—</span>
        </button>
      </li>
    </ul>
  </div>

  <!-- ENTRY VIEW -->
  <div class="post-view" id="post-entry">
    <button class="post-back" type="button">← Back</button>

    <!-- fetched post html will be injected here -->
    <article class="post-article" id="post-article">
      <h3 class="post-entry-title">Loading...</h3>
    </article>
  </div>

  <style>
    .post-view { display: none; }
    .post-view.active { display: block; }

    .post-header { margin-bottom: 1rem; }
    .post-subtitle { opacity: 0.75; margin-top: 0.5rem; line-height: 1.4; }

    .post-index {
      list-style: none;
      padding: 0;
      margin-top: 1.5rem;
    }

    .post-item {
      margin-bottom: 1rem;
    }

    
    .post-open {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.3rem;

      background: var(--content-bg);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: 12px;

      padding: 1rem 1.2rem;

      color: var(--text);
      cursor: pointer;
      text-align: left;

      transition: 
        transform 0.15s ease,
        box-shadow 0.15s ease,
        border-color 0.15s ease;
    }
    @media (hover: hover) and (pointer: fine) {
      .post-open:hover {
        transform: translateY(-3px);
        box-shadow: 0 6px 18px rgba(0,0,0,0.08);
      }
      body.light .post-open:hover {
        box-shadow: 0 6px 18px rgba(0,0,0,0.05);
      }
    }
    .post-open:active {
      transform: scale(0.99);
    }
    body.light .post-open:hover {
      box-shadow: 0 6px 18px rgba(0,0,0,0.05);
    }
    @media (max-width: 980px) {
      .post-open { margin-right: 0.8rem; }
      /* .post-open { padding: 0.9rem 1rem; padding-right: 1.6rem;} */
      .post-title { font-size: 1rem; }
      .post-meta { font-size: 0.8rem; }
      .post-article { padding: 1rem; }
      .post-index {
      padding-right: 0.8rem;
      }
    }
    .post-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
    }

    .post-meta {
      font-size: 0.85rem;
      opacity: 0.6;
      letter-spacing: 0.5px;
    }

    .post-back {
      background: none;
      border: none;
      color: var(--accent);
      cursor: pointer;
      padding: 0;
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }

    .post-article {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: rgba(255,255,255,0.02);
      padding: 1.2rem 1.2rem;
    }

    body.light .post-article {
      background: rgba(0,0,0,0.02);
    }

    .post-entry-title {
      margin-bottom: 0.4rem;
      line-height: 1.25;
    }

    .post-published {
      margin: 0.4rem 0 1.2rem;
      opacity: 0.7;
      font-size: 0.95rem;
    }
    .post-open, .post-back {
      -webkit-appearance: none;
      appearance: none;
    }
    .post-title {
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .post-article p {
      line-height: 1.7;
      margin: 0.9rem 0;
      white-space: pre-wrap; /* keeps your paragraph formatting */
    }
  </style>
</section>
