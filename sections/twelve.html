/* ===== Calendar sizing (single source of truth) ===== */
#twelve-weeks{
  --cell: 26px;
  --gap: 7px;
  --labelLeft: 4rem;
  --labelTop: 2.8rem;
}

.tw-grid-wrap{
  position: relative;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 2.8rem 1rem 1rem var(--labelLeft);
  background: rgba(255,255,255,0.02);
  overflow-x: auto;
}
body.light .tw-grid-wrap{ background: rgba(0,0,0,0.02); }

/* The grid tracks match the cell size */
.tw-grid{
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: var(--cell);
  grid-template-rows: repeat(7, var(--cell));
  gap: var(--gap);
  width: max-content;
}

/* Cells do NOT set their own size differently */
.tw-cell{
  width: var(--cell);
  height: var(--cell);
  border-radius: 6px;
  border: 1px solid rgba(255,255,255,0.06);
  box-sizing: border-box;
  position: relative;
  cursor: pointer;
  display: block; /* important: avoid inline layout weirdness */
}
body.light .tw-cell{ border: 1px solid rgba(0,0,0,0.08); }

/* Week labels align to the same grid columns */
.tw-week-labels{
  position: absolute;
  left: var(--labelLeft);
  top: 0.55rem;
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: var(--cell);
  gap: var(--gap);
  width: max-content;
  pointer-events: none;
  opacity: 0.7;
  font-size: 0.75rem;
}

/* Day labels align to the same grid rows */
.tw-day-labels{
  position: absolute;
  left: 0.7rem;
  top: var(--labelTop);
  display: grid;
  grid-template-rows: repeat(7, var(--cell));
  gap: var(--gap);
  align-items: center;
  font-size: 0.75rem;
  opacity: 0.75;
  pointer-events: none;
}
.tw-day-labels span{
  height: var(--cell);
  display: flex;
  align-items: center;
}
